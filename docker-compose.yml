version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jav_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jav_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecretPassword123!}
      POSTGRES_DB: ${POSTGRES_DB:-jav_leave_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jav_admin} -d ${POSTGRES_DB:-jav_leave_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jav_leave_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jav_admin}:${POSTGRES_PASSWORD:-SuperSecretPassword123!}@postgres:5432/${POSTGRES_DB:-jav_leave_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-production-secure-random-token-change-me-32-chars}
      APP_URL: ${APP_URL:-https://leave.jaynepal.org}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://leave.jaynepal.org}
      APP_TIMEZONE: Asia/Kathmandu
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-sobitb22@gmail.com}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Jaynepal Action Volunteers <sobitb22@gmail.com>}
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
